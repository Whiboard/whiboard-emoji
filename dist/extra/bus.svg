<feComposite in="c1" in2="SourceAlpha" operator="in" result="g1"/><feBlend in="g1" in2="SourceGraphic" mode="soft-light" result="b1"/>
<feTurbulence type="fractalNoise" baseFrequency="1.15" numOctaves="2" seed="5" result="n2"/>
<feColorMatrix in="n2" type="matrix" values="1.9 0 0 0 -.45  1.9 0 0 0 -.45  1.9 0 0 0 -.45  0 0 0 0 .2" result="c2"/>
<feComposite in="c2" in2="SourceAlpha" operator="in" result="g2"/><feBlend in="g2" in2="b1" mode="soft-light"/>
</filter><linearGradient id="ebus-0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C6E4F4"/><stop offset="1" stop-color="#93C4E2"/></linearGradient><linearGradient id="ebus-1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F0F3F6"/><stop offset="1" stop-color="#828A97"/></linearGradient><linearGradient id="ebus-2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBDA6A"/><stop offset="0.5" stop-color="#F1BE40"/><stop offset="1" stop-color="#D49828"/></linearGradient><linearGradient id="ebus-3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#BEC5CE"/><stop offset="1" stop-color="#5A616D"/></linearGradient></defs><g filter="url(#sk-tx)"><g filter="url(#sk-bv)"><path d="M6 31 a9 9 0 0 1 9 -9 H64 a7 7 0 0 1 7 7 V44 H85 a9 9 0 0 1 9 9 V72 a3 3 0 0 1 -3 3 H9 a3 3 0 0 1 -3 -3Z" fill="url(#ebus-2)"/></g>
