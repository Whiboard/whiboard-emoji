<g transform="rotate(-8 42 50)"><rect x="37.5" y="24" width="9" height="40" fill="url(#ecup-2)"/><polygon points="37.5,24 42,11 46.5,24" fill="#EBCB9A"/><polygon points="40.4,15.6 42,11 43.6,15.6" fill="#5A4F56"/></g>
<g transform="rotate(3 52 50)"><rect x="47.5" y="19" width="9" height="45" fill="url(#ecup-3)"/><polygon points="47.5,19 52,6 56.5,19" fill="#EBCB9A"/><polygon points="50.4,10.6 52,6 53.6,10.6" fill="#A2302E"/></g>
</g>
