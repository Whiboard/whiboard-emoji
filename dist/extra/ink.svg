<path d="M51 59 L56.4 67.6 L51 75.6 L45.6 67.6Z" fill="#44568F"/><path d="M51 66 V75" stroke="#FCF6E8" stroke-width="1"/><circle cx="51" cy="65.6" r="1.3" fill="#FCF6E8"/>
