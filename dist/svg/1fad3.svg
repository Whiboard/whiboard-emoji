<feTurbulence type="fractalNoise" baseFrequency="1.15" numOctaves="2" seed="5" result="n2"/>
<feColorMatrix in="n2" type="matrix" values="1.9 0 0 0 -.45  1.9 0 0 0 -.45  1.9 0 0 0 -.45  0 0 0 0 .2" result="c2"/>
<feComposite in="c2" in2="SourceAlpha" operator="in" result="g2"/><feBlend in="g2" in2="b1" mode="soft-light"/>
</filter><linearGradient id="e1fad3-0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FBEBC4"/><stop offset="0.5" stop-color="#EBC98A"/><stop offset="1" stop-color="#C99654"/></linearGradient></defs><g filter="url(#sk-tx)"><g filter="url(#sk-bv)"><g transform="rotate(32 50 52)"><path d="M50 4 C58 26 92 36 90 62 C88 86 68 96 50 96 C32 96 12 86 10 62 C8 36 42 26 50 4Z" fill="url(#e1fad3-0)"/></g></g>
