<feTurbulence type="fractalNoise" baseFrequency="1.15" numOctaves="2" seed="5" result="n2"/>
<feColorMatrix in="n2" type="matrix" values="1.9 0 0 0 -.45  1.9 0 0 0 -.45  1.9 0 0 0 -.45  0 0 0 0 .2" result="c2"/>
<feComposite in="c2" in2="SourceAlpha" operator="in" result="g2"/><feBlend in="g2" in2="b1" mode="soft-light"/>
</filter><linearGradient id="e1f691-0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EA6A60"/><stop offset="1" stop-color="#A2302E"/></linearGradient><linearGradient id="e1f691-1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C6E4F4"/><stop offset="1" stop-color="#93C4E2"/></linearGradient><linearGradient id="e1f691-2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FCF6E8"/><stop offset="0.5" stop-color="#E4D7B8"/><stop offset="1" stop-color="#C9BB95"/></linearGradient><linearGradient id="e1f691-3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F0F3F6"/><stop offset="1" stop-color="#828A97"/></linearGradient></defs><g filter="url(#sk-tx)"><g transform="translate(0 -1)">
