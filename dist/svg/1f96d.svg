<feComposite in="c2" in2="SourceAlpha" operator="in" result="g2"/><feBlend in="g2" in2="b1" mode="soft-light"/>
</filter><linearGradient id="e1f96d-0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E4DE6A"/><stop offset="0.333" stop-color="#F5B84C"/><stop offset="0.667" stop-color="#EE8A44"/><stop offset="1" stop-color="#D9503F"/></linearGradient><linearGradient id="e1f96d-1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9AC48C"/><stop offset="0.5" stop-color="#6FA263"/><stop offset="1" stop-color="#487745"/></linearGradient></defs><g filter="url(#sk-tx)"><g transform="translate(0 3)">
