<g filter="url(#sk-bvs)"><rect x="22" y="15" width="34" height="24" rx="3" fill="url(#e26fd-2)"/></g>
<rect x="27" y="22" width="24" height="9" rx="1.5" fill="#487745" opacity=".75"/>
