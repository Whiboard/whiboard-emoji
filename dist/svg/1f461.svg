<feComposite in="c1" in2="SourceAlpha" operator="in" result="g1"/><feBlend in="g1" in2="SourceGraphic" mode="soft-light" result="b1"/>
<feTurbulence type="fractalNoise" baseFrequency="1.15" numOctaves="2" seed="5" result="n2"/>
<feColorMatrix in="n2" type="matrix" values="1.9 0 0 0 -.45  1.9 0 0 0 -.45  1.9 0 0 0 -.45  0 0 0 0 .2" result="c2"/>
<feComposite in="c2" in2="SourceAlpha" operator="in" result="g2"/><feBlend in="g2" in2="b1" mode="soft-light"/>
</filter><linearGradient id="e1f461-0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C48C55"/><stop offset="1" stop-color="#935F34"/></linearGradient><linearGradient id="e1f461-1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E6BA85"/><stop offset="0.5" stop-color="#C48C55"/><stop offset="1" stop-color="#935F34"/></linearGradient><linearGradient id="e1f461-2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7B6C4"/><stop offset="0.5" stop-color="#EA6A60"/><stop offset="1" stop-color="#D04A44"/></linearGradient><linearGradient id="e1f461-3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7B6C4"/><stop offset="0.5" stop-color="#EA6A60"/><stop offset="1" stop-color="#D04A44"/></linearGradient><linearGradient id="e1f461-4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6CF5E"/><stop offset="1" stop-color="#B47E1E"/></linearGradient></defs><g filter="url(#sk-tx)"><g transform="translate(0 -5)">
