<feComposite in="c2" in2="SourceAlpha" operator="in" result="g2"/><feBlend in="g2" in2="b1" mode="soft-light"/>
</filter><linearGradient id="e1fa70-0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FBD3DD"/><stop offset="0.5" stop-color="#F7B6C4"/><stop offset="1" stop-color="#DF839B"/></linearGradient><linearGradient id="e1fa70-1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FBD3DD"/><stop offset="0.5" stop-color="#F7B6C4"/><stop offset="1" stop-color="#DF839B"/></linearGradient></defs><g filter="url(#sk-tx)"><g filter="url(#sk-bv)"><g transform="translate(-16 4) rotate(-14 50 50)">
