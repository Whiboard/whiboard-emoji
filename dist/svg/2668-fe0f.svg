<feTurbulence type="fractalNoise" baseFrequency="1.15" numOctaves="2" seed="5" result="n2"/>
<feColorMatrix in="n2" type="matrix" values="1.9 0 0 0 -.45  1.9 0 0 0 -.45  1.9 0 0 0 -.45  0 0 0 0 .2" result="c2"/>
<feComposite in="c2" in2="SourceAlpha" operator="in" result="g2"/><feBlend in="g2" in2="b1" mode="soft-light"/>
</filter><linearGradient id="e2668-fe0f-0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E3DCC8"/><stop offset="1" stop-color="#A9A28F"/></linearGradient><linearGradient id="e2668-fe0f-1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C6E4F4"/><stop offset="0.5" stop-color="#8FACE6"/><stop offset="1" stop-color="#6A8BD0"/></linearGradient></defs><g filter="url(#sk-tx)"><g filter="url(#sk-bv)"><path d="M10 68 H90 C90 82 76 90 50 90 C24 90 10 82 10 68Z" fill="url(#e2668-fe0f-0)"/></g>
