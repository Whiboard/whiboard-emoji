<g filter="url(#sk-bv)"><rect x="20" y="8" width="56" height="80" rx="5" fill="url(#e1f4d4-2)"/></g>
<rect x="20" y="8" width="11" height="80" rx="5" fill="#000" opacity=".16"/>
<rect x="37" y="17" width="34" height="54" rx="3" fill="none" stroke="#F6CF5E" stroke-width="1.8"/>
