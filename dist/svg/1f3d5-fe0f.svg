<feComposite in="c2" in2="SourceAlpha" operator="in" result="g2"/><feBlend in="g2" in2="b1" mode="soft-light"/>
</filter><linearGradient id="e1f3d5-fe0f-0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9AC48C"/><stop offset="1" stop-color="#487745"/></linearGradient><linearGradient id="e1f3d5-fe0f-1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9AC48C"/><stop offset="0.5" stop-color="#6FA263"/><stop offset="1" stop-color="#487745"/></linearGradient><linearGradient id="e1f3d5-fe0f-2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F5A95C"/><stop offset="1" stop-color="#D47F2E"/></linearGradient><linearGradient id="e1f3d5-fe0f-3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E6BA85"/><stop offset="1" stop-color="#F5A95C"/></linearGradient><linearGradient id="e1f3d5-fe0f-4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBDA6A"/><stop offset="0.5" stop-color="#F5A95C"/><stop offset="1" stop-color="#EA6A60"/></linearGradient></defs><g filter="url(#sk-tx)"><g transform="translate(0 -6)">
