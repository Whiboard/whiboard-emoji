<feComposite in="c2" in2="SourceAlpha" operator="in" result="g2"/><feBlend in="g2" in2="b1" mode="soft-light"/>
</filter><linearGradient id="e1fa99-0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FCE595"/><stop offset="0.333" stop-color="#F6CF5E"/><stop offset="0.667" stop-color="#E2AC36"/><stop offset="1" stop-color="#B47E1E"/></linearGradient><linearGradient id="e1fa99-1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF3BF"/><stop offset="0.5" stop-color="#F6CF5E"/><stop offset="1" stop-color="#E2AC36"/></linearGradient></defs><g filter="url(#sk-tx)"><g filter="url(#sk-bv)"><circle cx="50" cy="55" r="39" fill="#B47E1E"/><circle cx="50" cy="50" r="39" fill="url(#e1fa99-0)"/></g>
