<feComposite in="c1" in2="SourceAlpha" operator="in" result="g1"/><feBlend in="g1" in2="SourceGraphic" mode="soft-light" result="b1"/>
<feTurbulence type="fractalNoise" baseFrequency="1.15" numOctaves="2" seed="5" result="n2"/>
<feColorMatrix in="n2" type="matrix" values="1.9 0 0 0 -.45  1.9 0 0 0 -.45  1.9 0 0 0 -.45  0 0 0 0 .2" result="c2"/>
<feComposite in="c2" in2="SourceAlpha" operator="in" result="g2"/><feBlend in="g2" in2="b1" mode="soft-light"/>
</filter><linearGradient id="e1f3ea-0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C4BEAE"/><stop offset="1" stop-color="#8E887A"/></linearGradient><linearGradient id="e1f3ea-1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FCF6E8"/><stop offset="1" stop-color="#D3C39B"/></linearGradient><linearGradient id="e1f3ea-2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9AC48C"/><stop offset="0.5" stop-color="#6FA263"/><stop offset="1" stop-color="#487745"/></linearGradient><linearGradient id="e1f3ea-3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EA6A60"/><stop offset="1" stop-color="#A2302E"/></linearGradient><linearGradient id="e1f3ea-4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C6E4F4"/><stop offset="1" stop-color="#93C4E2"/></linearGradient><linearGradient id="e1f3ea-5" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C6E4F4"/><stop offset="1" stop-color="#93C4E2"/></linearGradient></defs><g filter="url(#sk-tx)"><g filter="url(#sk-bv)"><rect x="6" y="87" width="88" height="6" rx="2.5" fill="url(#e1f3ea-0)"/></g>
