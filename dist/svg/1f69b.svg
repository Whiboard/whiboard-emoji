<feColorMatrix in="n1" type="matrix" values="2.6 0 0 0 -.8  2.6 0 0 0 -.8  2.6 0 0 0 -.8  0 0 0 0 .3" result="c1"/>
<feComposite in="c1" in2="SourceAlpha" operator="in" result="g1"/><feBlend in="g1" in2="SourceGraphic" mode="soft-light" result="b1"/>
<feTurbulence type="fractalNoise" baseFrequency="1.15" numOctaves="2" seed="5" result="n2"/>
<feColorMatrix in="n2" type="matrix" values="1.9 0 0 0 -.45  1.9 0 0 0 -.45  1.9 0 0 0 -.45  0 0 0 0 .2" result="c2"/>
<feComposite in="c2" in2="SourceAlpha" operator="in" result="g2"/><feBlend in="g2" in2="b1" mode="soft-light"/>
</filter><linearGradient id="e1f69b-0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FCF6E8"/><stop offset="0.5" stop-color="#E4D7B8"/><stop offset="1" stop-color="#C9BB95"/></linearGradient><linearGradient id="e1f69b-1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8FACE6"/><stop offset="0.5" stop-color="#6A8BD0"/><stop offset="1" stop-color="#4764AA"/></linearGradient><linearGradient id="e1f69b-2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C6E4F4"/><stop offset="1" stop-color="#93C4E2"/></linearGradient><linearGradient id="e1f69b-3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#BEC5CE"/><stop offset="1" stop-color="#5A616D"/></linearGradient><linearGradient id="e1f69b-4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F0F3F6"/><stop offset="1" stop-color="#828A97"/></linearGradient></defs><g filter="url(#sk-tx)"><g transform="translate(0 0)">
