<feComposite in="c2" in2="SourceAlpha" operator="in" result="g2"/><feBlend in="g2" in2="b1" mode="soft-light"/>
</filter><linearGradient id="e1f963-0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8FACE6"/><stop offset="0.5" stop-color="#5B7CC4"/><stop offset="1" stop-color="#3F5A9E"/></linearGradient><linearGradient id="e1f963-1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FCF6E8"/><stop offset="1" stop-color="#D9C9A3"/></linearGradient><linearGradient id="e1f963-2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F0F3F6"/><stop offset="0.5" stop-color="#BEC5CE"/><stop offset="1" stop-color="#828A97"/></linearGradient></defs><g filter="url(#sk-tx)"><g filter="url(#sk-bv)"><path d="M9 46 H91 C91 74 74 90 50 90 C26 90 9 74 9 46Z" fill="url(#e1f963-0)"/></g>
