<feComposite in="c1" in2="SourceAlpha" operator="in" result="g1"/><feBlend in="g1" in2="SourceGraphic" mode="soft-light" result="b1"/>
<feTurbulence type="fractalNoise" baseFrequency="1.15" numOctaves="2" seed="5" result="n2"/>
<feColorMatrix in="n2" type="matrix" values="1.9 0 0 0 -.45  1.9 0 0 0 -.45  1.9 0 0 0 -.45  0 0 0 0 .2" result="c2"/>
<feComposite in="c2" in2="SourceAlpha" operator="in" result="g2"/><feBlend in="g2" in2="b1" mode="soft-light"/>
</filter><linearGradient id="e1f5fa-fe0f-0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A9CCEF"/><stop offset="1" stop-color="#6F9AD6"/></linearGradient><linearGradient id="e1f5fa-fe0f-1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9AC48C"/><stop offset="0.5" stop-color="#6FA263"/><stop offset="1" stop-color="#487745"/></linearGradient><clipPath id="e1f5fa-fe0f-2"><rect x="8" y="8" width="84" height="84" rx="14"/></clipPath></defs><g filter="url(#sk-tx)"><g filter="url(#sk-bv)"><rect x="8" y="8" width="84" height="84" rx="14" fill="url(#e1f5fa-fe0f-0)"/></g><g clip-path="url(#e1f5fa-fe0f-2)"><g fill="url(#e1f5fa-fe0f-1)"><path d="M14 24 C22 16 34 18 40 26 C38 34 30 36 28 42 C20 40 12 32 14 24Z"/><path d="M28 50 C36 48 42 54 40 62 C38 72 32 82 28 78 C24 70 24 56 28 50Z"/><path d="M46 22 C54 16 62 20 60 28 C56 30 54 34 58 40 C64 46 62 58 56 68 C50 72 46 66 46 58 C44 50 36 46 44 38 C42 32 42 26 46 22Z"/><path d="M64 22 C72 14 88 18 92 28 C88 38 80 38 76 44 C68 44 62 36 62 28Z"/><path d="M72 62 C80 58 92 62 90 70 C84 78 72 74 72 62Z"/></g>
