<feColorMatrix in="n1" type="matrix" values="2.6 0 0 0 -.8  2.6 0 0 0 -.8  2.6 0 0 0 -.8  0 0 0 0 .3" result="c1"/>
<feComposite in="c1" in2="SourceAlpha" operator="in" result="g1"/><feBlend in="g1" in2="SourceGraphic" mode="soft-light" result="b1"/>
<feTurbulence type="fractalNoise" baseFrequency="1.15" numOctaves="2" seed="5" result="n2"/>
<feColorMatrix in="n2" type="matrix" values="1.9 0 0 0 -.45  1.9 0 0 0 -.45  1.9 0 0 0 -.45  0 0 0 0 .2" result="c2"/>
<feComposite in="c2" in2="SourceAlpha" operator="in" result="g2"/><feBlend in="g2" in2="b1" mode="soft-light"/>
</filter><linearGradient id="e1f45b-0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8887E"/><stop offset="0.5" stop-color="#EA6A60"/><stop offset="1" stop-color="#A2302E"/></linearGradient><linearGradient id="e1f45b-1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EA6A60"/><stop offset="1" stop-color="#D04A44"/></linearGradient><linearGradient id="e1f45b-2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F6CF5E"/><stop offset="1" stop-color="#B47E1E"/></linearGradient></defs><g filter="url(#sk-tx)"><g filter="url(#sk-bvs)"><path d="M30 46 C26 8 74 8 70 46" fill="none" stroke="#A2302E" stroke-width="4.5" stroke-linecap="round"/></g>
