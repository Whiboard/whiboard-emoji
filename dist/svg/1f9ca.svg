<feTurbulence type="fractalNoise" baseFrequency="1.15" numOctaves="2" seed="5" result="n2"/>
<feColorMatrix in="n2" type="matrix" values="1.9 0 0 0 -.45  1.9 0 0 0 -.45  1.9 0 0 0 -.45  0 0 0 0 .2" result="c2"/>
<feComposite in="c2" in2="SourceAlpha" operator="in" result="g2"/><feBlend in="g2" in2="b1" mode="soft-light"/>
</filter><linearGradient id="e1f9ca-0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F6FCFF"/><stop offset="1" stop-color="#BCE0F3"/></linearGradient><linearGradient id="e1f9ca-1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B4DAEF"/><stop offset="1" stop-color="#7DB5D8"/></linearGradient><linearGradient id="e1f9ca-2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8FC0E0"/><stop offset="1" stop-color="#5D93BF"/></linearGradient></defs><g filter="url(#sk-tx)"><g filter="url(#sk-bv)">
