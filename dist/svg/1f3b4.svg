<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="256" height="256"><title>flower playing cards</title><defs>
<filter id="sk-bv" filterUnits="userSpaceOnUse" x="-10" y="-10" width="120" height="120" color-interpolation-filters="sRGB">
<feOffset in="SourceAlpha" dx="1.5" dy="1.8" result="o1"/><feComposite in="SourceAlpha" in2="o1" operator="out" result="hl"/>
<feGaussianBlur in="hl" stdDeviation="1.1" result="hlb"/><feFlood flood-color="#FFF8E4" flood-opacity=".6" result="hf"/><feComposite in="hf" in2="hlb" operator="in" result="hlc"/>
<feOffset in="SourceAlpha" dx="-2.2" dy="-2.6" result="o2"/><feComposite in="SourceAlpha" in2="o2" operator="out" result="sh"/>
<feGaussianBlur in="sh" stdDeviation="1.5" result="shb"/><feFlood flood-color="#3A1C10" flood-opacity=".36" result="sf"/><feComposite in="sf" in2="shb" operator="in" result="shc"/>
<feComposite in="shc" in2="SourceGraphic" operator="atop" result="a1"/><feComposite in="hlc" in2="a1" operator="atop"/>
</filter>
<filter id="sk-bvs" filterUnits="userSpaceOnUse" x="-10" y="-10" width="120" height="120" color-interpolation-filters="sRGB">
<feOffset in="SourceAlpha" dx=".8" dy="1" result="o1"/><feComposite in="SourceAlpha" in2="o1" operator="out" result="hl"/>
<feGaussianBlur in="hl" stdDeviation=".6" result="hlb"/><feFlood flood-color="#FFF8E4" flood-opacity=".55" result="hf"/><feComposite in="hf" in2="hlb" operator="in" result="hlc"/>
<feOffset in="SourceAlpha" dx="-1.1" dy="-1.4" result="o2"/><feComposite in="SourceAlpha" in2="o2" operator="out" result="sh"/>
<feGaussianBlur in="sh" stdDeviation=".8" result="shb"/><feFlood flood-color="#3A1C10" flood-opacity=".32" result="sf"/><feComposite in="sf" in2="shb" operator="in" result="shc"/>
<feComposite in="shc" in2="SourceGraphic" operator="atop" result="a1"/><feComposite in="hlc" in2="a1" operator="atop"/>
</filter>
<filter id="sk-tx" filterUnits="userSpaceOnUse" x="-6" y="-6" width="112" height="112" color-interpolation-filters="sRGB">
<feTurbulence type="fractalNoise" baseFrequency=".06" numOctaves="3" seed="11" result="n1"/>
<feColorMatrix in="n1" type="matrix" values="2.6 0 0 0 -.8  2.6 0 0 0 -.8  2.6 0 0 0 -.8  0 0 0 0 .3" result="c1"/>
<feComposite in="c1" in2="SourceAlpha" operator="in" result="g1"/><feBlend in="g1" in2="SourceGraphic" mode="soft-light" result="b1"/>
<feTurbulence type="fractalNoise" baseFrequency="1.15" numOctaves="2" seed="5" result="n2"/>
<feColorMatrix in="n2" type="matrix" values="1.9 0 0 0 -.45  1.9 0 0 0 -.45  1.9 0 0 0 -.45  0 0 0 0 .2" result="c2"/>
<feComposite in="c2" in2="SourceAlpha" operator="in" result="g2"/><feBlend in="g2" in2="b1" mode="soft-light"/>
</filter><linearGradient id="e1f3b4-0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EA6A60"/><stop offset="0.5" stop-color="#D04A44"/><stop offset="1" stop-color="#A2302E"/></linearGradient><linearGradient id="e1f3b4-1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FCF6E8"/><stop offset="1" stop-color="#E4D7B8"/></linearGradient><linearGradient id="e1f3b4-2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#44568F"/><stop offset="1" stop-color="#2F3C68"/></linearGradient><radialGradient id="e1f3b4-3" cx="0.4" cy="0.35" r="0.8"><stop offset="0" stop-color="#F7B6C4"/><stop offset="1" stop-color="#EA6A60"/></radialGradient><radialGradient id="e1f3b4-4" cx="0.4" cy="0.35" r="0.8"><stop offset="0" stop-color="#F7B6C4"/><stop offset="1" stop-color="#EA6A60"/></radialGradient><radialGradient id="e1f3b4-5" cx="0.4" cy="0.35" r="0.8"><stop offset="0" stop-color="#F7B6C4"/><stop offset="1" stop-color="#EA6A60"/></radialGradient><radialGradient id="e1f3b4-6" cx="0.4" cy="0.35" r="0.8"><stop offset="0" stop-color="#F7B6C4"/><stop offset="1" stop-color="#EA6A60"/></radialGradient><radialGradient id="e1f3b4-7" cx="0.4" cy="0.35" r="0.8"><stop offset="0" stop-color="#F7B6C4"/><stop offset="1" stop-color="#EA6A60"/></radialGradient><linearGradient id="e1f3b4-8" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6CF5E"/><stop offset="1" stop-color="#B47E1E"/></linearGradient></defs><g filter="url(#sk-tx)"><g filter="url(#sk-bv)"><g transform="rotate(14 50 50)"><rect x="34" y="7" width="52" height="84" rx="6" fill="url(#e1f3b4-0)"/></g></g>
<g transform="rotate(14 50 50)" fill="none" stroke="#FCF6E8" stroke-width="1.6" opacity=".8"><rect x="40" y="13" width="40" height="72" rx="3"/><path d="M60 24 L74 49 L60 74 L46 49Z"/></g>
<g filter="url(#sk-bv)"><g transform="rotate(-8 50 50)"><rect x="14" y="8" width="52" height="84" rx="6" fill="url(#e1f3b4-1)"/></g></g>
<g transform="rotate(-8 50 50)"><rect x="20" y="14" width="40" height="72" rx="3" fill="url(#e1f3b4-2)"/>
<path d="M40 82 C40 70 38 62 40 56" fill="none" stroke="#6FA263" stroke-width="2.4"/>
<path d="M40 72 C32 70 28 64 30 60 C36 60 40 64 40 72Z M40 68 C48 66 52 60 50 56 C44 56 40 60 40 68Z" fill="#6FA263"/>
<g filter="url(#sk-bvs)"><circle cx="40.0" cy="30.0" r="7.4" fill="url(#e1f3b4-3)"/><circle cx="49.5" cy="36.9" r="7.4" fill="url(#e1f3b4-4)"/><circle cx="45.9" cy="48.1" r="7.4" fill="url(#e1f3b4-5)"/><circle cx="34.1" cy="48.1" r="7.4" fill="url(#e1f3b4-6)"/><circle cx="30.5" cy="36.9" r="7.4" fill="url(#e1f3b4-7)"/><circle cx="40" cy="40" r="4.6" fill="url(#e1f3b4-8)"/></g></g></g></svg>
