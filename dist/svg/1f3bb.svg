<feColorMatrix in="n1" type="matrix" values="2.6 0 0 0 -.8  2.6 0 0 0 -.8  2.6 0 0 0 -.8  0 0 0 0 .3" result="c1"/>
<feComposite in="c1" in2="SourceAlpha" operator="in" result="g1"/><feBlend in="g1" in2="SourceGraphic" mode="soft-light" result="b1"/>
<feTurbulence type="fractalNoise" baseFrequency="1.15" numOctaves="2" seed="5" result="n2"/>
<feColorMatrix in="n2" type="matrix" values="1.9 0 0 0 -.45  1.9 0 0 0 -.45  1.9 0 0 0 -.45  0 0 0 0 .2" result="c2"/>
<feComposite in="c2" in2="SourceAlpha" operator="in" result="g2"/><feBlend in="g2" in2="b1" mode="soft-light"/>
</filter><linearGradient id="e1f3bb-0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3A3237"/><stop offset="1" stop-color="#5A4F56"/></linearGradient><radialGradient id="e1f3bb-1" cx="0.36" cy="0.3" r="0.8"><stop offset="0" stop-color="#C48C55"/><stop offset="0.5" stop-color="#935F34"/><stop offset="1" stop-color="#6B4324"/></radialGradient><radialGradient id="e1f3bb-2" cx="0.36" cy="0.3" r="0.8"><stop offset="0" stop-color="#F5A95C"/><stop offset="0.5" stop-color="#D47F2E"/><stop offset="1" stop-color="#8A4820"/></radialGradient></defs><g filter="url(#sk-tx)"><g filter="url(#sk-bv)"><g transform="rotate(28 50 50)">
