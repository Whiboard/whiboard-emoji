<feComposite in="c1" in2="SourceAlpha" operator="in" result="g1"/><feBlend in="g1" in2="SourceGraphic" mode="soft-light" result="b1"/>
<feTurbulence type="fractalNoise" baseFrequency="1.15" numOctaves="2" seed="5" result="n2"/>
<feColorMatrix in="n2" type="matrix" values="1.9 0 0 0 -.45  1.9 0 0 0 -.45  1.9 0 0 0 -.45  0 0 0 0 .2" result="c2"/>
<feComposite in="c2" in2="SourceAlpha" operator="in" result="g2"/><feBlend in="g2" in2="b1" mode="soft-light"/>
</filter><linearGradient id="e1f950-0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6CE86"/><stop offset="0.5" stop-color="#DB9B4C"/><stop offset="1" stop-color="#B26F30"/></linearGradient></defs><g filter="url(#sk-tx)"><g filter="url(#sk-bv)"><ellipse cx="15" cy="67" rx="11" ry="8" transform="rotate(62 15 67)" fill="url(#e1f950-0)"/><ellipse cx="85" cy="67" rx="11" ry="8" transform="rotate(-62 85 67)" fill="url(#e1f950-0)"/></g>
<g filter="url(#sk-bv)"><ellipse cx="25" cy="50" rx="14.5" ry="11.5" transform="rotate(38 25 50)" fill="url(#e1f950-0)"/><ellipse cx="75" cy="50" rx="14.5" ry="11.5" transform="rotate(-38 75 50)" fill="url(#e1f950-0)"/></g>
