<feComposite in="c1" in2="SourceAlpha" operator="in" result="g1"/><feBlend in="g1" in2="SourceGraphic" mode="soft-light" result="b1"/>
<feTurbulence type="fractalNoise" baseFrequency="1.15" numOctaves="2" seed="5" result="n2"/>
<feColorMatrix in="n2" type="matrix" values="1.9 0 0 0 -.45  1.9 0 0 0 -.45  1.9 0 0 0 -.45  0 0 0 0 .2" result="c2"/>
<feComposite in="c2" in2="SourceAlpha" operator="in" result="g2"/><feBlend in="g2" in2="b1" mode="soft-light"/>
</filter><linearGradient id="e1f994-0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8B96B8"/><stop offset="0.5" stop-color="#5A4F56"/><stop offset="1" stop-color="#3A3237"/></linearGradient><linearGradient id="e1f994-1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E6BA85"/><stop offset="1" stop-color="#C48C55"/></linearGradient><linearGradient id="e1f994-2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F1D3A0"/><stop offset="0.5" stop-color="#DDB57A"/><stop offset="1" stop-color="#BC8D54"/></linearGradient><linearGradient id="e1f994-3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F1D3A0"/><stop offset="1" stop-color="#BC8D54"/></linearGradient></defs><g filter="url(#sk-tx)"><g transform="translate(50 50) scale(1) translate(-52 -57)">
