<feComposite in="c1" in2="SourceAlpha" operator="in" result="g1"/><feBlend in="g1" in2="SourceGraphic" mode="soft-light" result="b1"/>
<feTurbulence type="fractalNoise" baseFrequency="1.15" numOctaves="2" seed="5" result="n2"/>
<feColorMatrix in="n2" type="matrix" values="1.9 0 0 0 -.45  1.9 0 0 0 -.45  1.9 0 0 0 -.45  0 0 0 0 .2" result="c2"/>
<feComposite in="c2" in2="SourceAlpha" operator="in" result="g2"/><feBlend in="g2" in2="b1" mode="soft-light"/>
</filter><linearGradient id="e1f686-0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C6E4F4"/><stop offset="1" stop-color="#93C4E2"/></linearGradient><linearGradient id="e1f686-1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F0F3F6"/><stop offset="1" stop-color="#828A97"/></linearGradient><linearGradient id="e1f686-2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F0F3F6"/><stop offset="1" stop-color="#828A97"/></linearGradient><linearGradient id="e1f686-3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F0F3F6"/><stop offset="1" stop-color="#828A97"/></linearGradient><linearGradient id="e1f686-4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F0F3F6"/><stop offset="1" stop-color="#828A97"/></linearGradient><linearGradient id="e1f686-5" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8FACE6"/><stop offset="0.5" stop-color="#6A8BD0"/><stop offset="1" stop-color="#4764AA"/></linearGradient><linearGradient id="e1f686-6" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#BEC5CE"/><stop offset="1" stop-color="#5A616D"/></linearGradient></defs><g filter="url(#sk-tx)"><g filter="url(#sk-bv)"><g transform="translate(0 -4)"><path d="M6 56 C6 35 16 26 32 26 H90 a4 4 0 0 1 4 4 V68 a4 4 0 0 1 -4 4 H10 a4 4 0 0 1 -4 -4Z" fill="url(#e1f686-5)"/></g></g>
