<feTurbulence type="fractalNoise" baseFrequency="1.15" numOctaves="2" seed="5" result="n2"/>
<feColorMatrix in="n2" type="matrix" values="1.9 0 0 0 -.45  1.9 0 0 0 -.45  1.9 0 0 0 -.45  0 0 0 0 .2" result="c2"/>
<feComposite in="c2" in2="SourceAlpha" operator="in" result="g2"/><feBlend in="g2" in2="b1" mode="soft-light"/>
</filter><linearGradient id="e1f460-0" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#D04A44"/><stop offset="1" stop-color="#A2302E"/></linearGradient><linearGradient id="e1f460-1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8887E"/><stop offset="0.5" stop-color="#EA6A60"/><stop offset="1" stop-color="#A2302E"/></linearGradient><linearGradient id="e1f460-2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3A3237"/><stop offset="1" stop-color="#5A4F56"/></linearGradient></defs><g filter="url(#sk-tx)"><g transform="translate(-3 -9)">
