<g filter="url(#sk-bv)"><path d="M6 21 Q50 35 94 21 L90 30 Q50 40 10 30Z" fill="url(#e26e9-fe0f-4)"/></g>
<g filter="url(#sk-bvs)"><rect x="18" y="86" width="16" height="5" rx="1.5" fill="url(#e26e9-fe0f-5)"/><rect x="66" y="86" width="16" height="5" rx="1.5" fill="url(#e26e9-fe0f-6)"/></g></g></g></svg>
