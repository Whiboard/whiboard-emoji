<feComposite in="c1" in2="SourceAlpha" operator="in" result="g1"/><feBlend in="g1" in2="SourceGraphic" mode="soft-light" result="b1"/>
<feTurbulence type="fractalNoise" baseFrequency="1.15" numOctaves="2" seed="5" result="n2"/>
<feColorMatrix in="n2" type="matrix" values="1.9 0 0 0 -.45  1.9 0 0 0 -.45  1.9 0 0 0 -.45  0 0 0 0 .2" result="c2"/>
<feComposite in="c2" in2="SourceAlpha" operator="in" result="g2"/><feBlend in="g2" in2="b1" mode="soft-light"/>
</filter><linearGradient id="e1f432-0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6CF5E"/><stop offset="1" stop-color="#B47E1E"/></linearGradient><linearGradient id="e1f432-1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F5A95C"/><stop offset="1" stop-color="#D47F2E"/></linearGradient><clipPath id="e1f432-2"><ellipse cx="50" cy="54" rx="38" ry="32"/></clipPath><linearGradient id="e1f432-3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B7DCA6"/><stop offset="0.5" stop-color="#6FA263"/><stop offset="1" stop-color="#487745"/></linearGradient><linearGradient id="e1f432-4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F5A95C"/><stop offset="1" stop-color="#D47F2E"/></linearGradient><linearGradient id="e1f432-5" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D8EDC9"/><stop offset="0.5" stop-color="#9AC48C"/><stop offset="1" stop-color="#6FA263"/></linearGradient></defs><g filter="url(#sk-tx)"><g filter="url(#sk-bvs)"><path d="M26 30 L18 6 L40 22Z M74 30 L82 6 L60 22Z" fill="url(#e1f432-0)"/><path d="M16 46 L5 36 L4 62 L18 64Z M84 46 L95 36 L96 62 L82 64Z" fill="url(#e1f432-1)"/></g>
