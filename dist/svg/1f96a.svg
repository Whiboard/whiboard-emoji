<feColorMatrix in="n2" type="matrix" values="1.9 0 0 0 -.45  1.9 0 0 0 -.45  1.9 0 0 0 -.45  0 0 0 0 .2" result="c2"/>
<feComposite in="c2" in2="SourceAlpha" operator="in" result="g2"/><feBlend in="g2" in2="b1" mode="soft-light"/>
</filter><linearGradient id="e1f96a-0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6E2B6"/><stop offset="1" stop-color="#D8B67A"/></linearGradient><linearGradient id="e1f96a-1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7B6C4"/><stop offset="1" stop-color="#DF839B"/></linearGradient><linearGradient id="e1f96a-2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBDA6A"/><stop offset="1" stop-color="#D49828"/></linearGradient><linearGradient id="e1f96a-3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EA6A60"/><stop offset="1" stop-color="#A2302E"/></linearGradient><linearGradient id="e1f96a-4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9AC48C"/><stop offset="1" stop-color="#487745"/></linearGradient><linearGradient id="e1f96a-5" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6E2B6"/><stop offset="0.5" stop-color="#E2BE82"/><stop offset="1" stop-color="#C79A5C"/></linearGradient></defs><g filter="url(#sk-tx)"><g filter="url(#sk-bv)"><path d="M10 74 H90 V84 a6 6 0 0 1 -6 6 H16 a6 6 0 0 1 -6 -6Z" fill="url(#e1f96a-0)"/></g>
