<g filter="url(#sk-bv)"><g transform="translate(33 62) rotate(10) scale(-1 1)"><rect x="-14" y="-26" width="28" height="10" fill="url(#e1f37b-2)"/><circle cx="-8" cy="-27" r="8" fill="url(#e1f37b-2)"/><circle cx="3" cy="-31" r="9" fill="url(#e1f37b-2)"/><circle cx="11" cy="-26" r="7" fill="url(#e1f37b-2)"/></g></g>
