<feComposite in="c2" in2="SourceAlpha" operator="in" result="g2"/><feBlend in="g2" in2="b1" mode="soft-light"/>
</filter><linearGradient id="e2615-0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FCF6E8"/><stop offset="1" stop-color="#D9C9A3"/></linearGradient><linearGradient id="e2615-1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FCF6E8"/><stop offset="0.5" stop-color="#E4D7B8"/><stop offset="1" stop-color="#D9C9A3"/></linearGradient><linearGradient id="e2615-2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FCF6E8"/><stop offset="1" stop-color="#D9C9A3"/></linearGradient><linearGradient id="e2615-3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8A5A36"/><stop offset="1" stop-color="#5E361C"/></linearGradient></defs><g filter="url(#sk-tx)"><g filter="url(#sk-bv)"><ellipse cx="50" cy="85" rx="40" ry="8" fill="url(#e2615-0)"/></g>
