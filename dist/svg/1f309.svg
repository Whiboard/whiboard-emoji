<feComposite in="c1" in2="SourceAlpha" operator="in" result="g1"/><feBlend in="g1" in2="SourceGraphic" mode="soft-light" result="b1"/>
<feTurbulence type="fractalNoise" baseFrequency="1.15" numOctaves="2" seed="5" result="n2"/>
<feColorMatrix in="n2" type="matrix" values="1.9 0 0 0 -.45  1.9 0 0 0 -.45  1.9 0 0 0 -.45  0 0 0 0 .2" result="c2"/>
<feComposite in="c2" in2="SourceAlpha" operator="in" result="g2"/><feBlend in="g2" in2="b1" mode="soft-light"/>
</filter><linearGradient id="e1f309-0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#26305E"/><stop offset="1" stop-color="#5A66A0"/></linearGradient><linearGradient id="e1f309-1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2F3C68"/><stop offset="1" stop-color="#1F2850"/></linearGradient><clipPath id="e1f309-2"><rect x="8" y="8" width="84" height="84" rx="14"/></clipPath></defs><g filter="url(#sk-tx)"><g filter="url(#sk-bv)"><rect x="8" y="8" width="84" height="84" rx="14" fill="url(#e1f309-0)"/></g><g clip-path="url(#e1f309-2)"><g fill="#FCF6E8"><polygon points="22.00,19.00 23.41,22.59 27.00,24.00 23.41,25.41 22.00,29.00 20.59,25.41 17.00,24.00 20.59,22.59"/><circle cx="46" cy="16" r="1.3"/><circle cx="76" cy="30" r="1.5"/><circle cx="12" cy="44" r="1.3"/></g>
