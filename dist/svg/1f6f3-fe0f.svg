<feComposite in="c1" in2="SourceAlpha" operator="in" result="g1"/><feBlend in="g1" in2="SourceGraphic" mode="soft-light" result="b1"/>
<feTurbulence type="fractalNoise" baseFrequency="1.15" numOctaves="2" seed="5" result="n2"/>
<feColorMatrix in="n2" type="matrix" values="1.9 0 0 0 -.45  1.9 0 0 0 -.45  1.9 0 0 0 -.45  0 0 0 0 .2" result="c2"/>
<feComposite in="c2" in2="SourceAlpha" operator="in" result="g2"/><feBlend in="g2" in2="b1" mode="soft-light"/>
</filter><linearGradient id="e1f6f3-fe0f-0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#44568F"/><stop offset="1" stop-color="#2F3C68"/></linearGradient><linearGradient id="e1f6f3-fe0f-1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FCF6E8"/><stop offset="1" stop-color="#E4D7B8"/></linearGradient><linearGradient id="e1f6f3-fe0f-2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FCF6E8"/><stop offset="1" stop-color="#E4D7B8"/></linearGradient><linearGradient id="e1f6f3-fe0f-3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FCF6E8"/><stop offset="1" stop-color="#E4D7B8"/></linearGradient><linearGradient id="e1f6f3-fe0f-4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EA6A60"/><stop offset="1" stop-color="#A2302E"/></linearGradient><linearGradient id="e1f6f3-fe0f-5" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#93C4E2"/><stop offset="1" stop-color="#6A8BD0"/></linearGradient></defs><g filter="url(#sk-tx)"><g transform="translate(3.50 2.50) scale(0.93)">
