# Publishes the preview page (index.html + the built set) to GitHub Pages.
# Needs: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - dist/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # only what the page reads: itself, the SVGs, the sprite sheets and the index
      - name: Collect the site
        run: |
          mkdir -p _site/dist
          cp index.html _site/
          cp -R dist/svg dist/sprites dist/index.json _site/dist/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
